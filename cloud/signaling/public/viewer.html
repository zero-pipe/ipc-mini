<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef5fc" />
  <title>ipc_mini · 智能看护</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef5fc;
      --surface: #ffffff;
      --surface-soft: #eaf3fd;
      --line: #d9e6f3;
      --line-strong: #bfd3e8;
      --text: #17324d;
      --muted: #657d96;
      --primary: #2474e5;
      --success: #169b69;
      --warning: #d68a19;
      --danger: #df5262;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 85% -10%, rgba(70, 142, 234, .14), transparent 34rem),
        radial-gradient(circle at -15% 65%, rgba(88, 171, 234, .08), transparent 28rem),
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease,
        color .16s ease, opacity .16s ease, transform .16s ease;
    }

    button:disabled { cursor: not-allowed; opacity: .45; }
    button:active:not(:disabled) { transform: scale(.96); }
    button:focus-visible, input:focus-visible {
      outline: 2px solid rgba(91, 155, 255, .9);
      outline-offset: 2px;
    }

    .app {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 20px clamp(14px, 3vw, 32px) 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid #b9d2f2;
      border-radius: 12px;
      background: linear-gradient(145deg, #e7f2ff, #f5f9ff);
      color: var(--primary);
      box-shadow: 0 5px 14px rgba(42, 108, 190, .1);
    }

    .brand-mark svg { width: 22px; height: 22px; }
    .brand h1 { margin: 0; font-size: 19px; letter-spacing: .01em; }

    .connection-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(30, 77, 125, .06);
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #91a5b9;
    }

    .connection-state[data-tone="working"] .state-dot {
      background: var(--warning);
      animation: pulse 1.2s infinite;
    }

    .connection-state[data-tone="online"] {
      border-color: #b9e7d5;
      background: #edf9f4;
      color: #157854;
    }
    .connection-state[data-tone="online"] .state-dot {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(22, 155, 105, .09);
    }
    .connection-state[data-tone="error"] .state-dot { background: var(--danger); }

    @keyframes pulse {
      50% { opacity: .35; }
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .96);
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(43, 85, 126, .08);
    }

    .viewer-card { min-width: 0; }

    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 52px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfdff, #f6faff);
    }

    .viewer-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--text);
    }

    .viewer-title svg {
      width: 18px;
      height: 18px;
      color: var(--primary);
      flex: 0 0 auto;
    }

    .live-badge {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #f4c5cb;
      background: #fff0f2;
      color: #cf3f50;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .06em;
    }

    .live-badge.visible { display: inline-flex; }

    .mode-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f3f8fe;
      gap: 2px;
    }

    .mode-btn {
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .mode-btn.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(30, 77, 125, .1);
    }

    .replay-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }

    .replay-bar.hidden { display: none; }

    .replay-bar label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .replay-bar select {
      min-height: 34px;
      min-width: 10em;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 13px;
    }

    .replay-status {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .live-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.2s infinite;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    /* Icon action buttons */
    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line);
      background: #f5f9fe;
      color: #4f6d8b;
      position: relative;
    }

    .icon-btn svg { width: 18px; height: 18px; }

    .icon-btn[hidden] { display: none !important; }

    .icon-btn:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: var(--surface-soft);
      color: var(--text);
    }

    .icon-btn.active {
      border-color: #2f9e6b;
      background: #e8f8f0;
      color: #1f7a52;
    }

    .icon-btn.danger-active {
      border-color: #f2c4ca;
      background: #fff0f2;
      color: var(--danger);
    }

    .icon-btn[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      padding: 5px 8px;
      border-radius: 8px;
      background: #1c3349;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .14s ease, transform .14s ease;
      z-index: 5;
    }

    .icon-btn[data-tip]:hover::after,
    .icon-btn[data-tip]:focus-visible::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(70, 116, 158, .18), transparent 38%),
        linear-gradient(145deg, #172d42, #102438);
      box-shadow: inset 0 0 60px rgba(4, 18, 31, .18);
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video { object-fit: contain; background: #12283c; }
    canvas { pointer-events: none; }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
      pointer-events: none;
    }

    .empty-state.hidden { display: none; }

    .empty-icon {
      width: 48px;
      height: 48px;
      padding: 12px;
      border: 1px solid rgba(171, 203, 232, .3);
      border-radius: 14px;
      color: #b9d7f1;
      background: rgba(42, 75, 106, .42);
    }

    .empty-state strong { color: #edf6ff; font-size: 14px; font-weight: 650; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 12px 14px;
      border-right: 1px solid var(--line);
      background: #f8fbff;
    }

    .metric:last-child { border-right: 0; }

    .metric-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border: 1px solid #dce8f4;
      border-radius: 9px;
      background: #fff;
      color: #6f88a3;
    }

    .metric-icon svg { width: 15px; height: 15px; }

    .metric-value {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #234765;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    .sidebar { display: grid; height: 100%; }
    .panel { padding: 16px; }
    .connection-panel {
      display: flex;
      height: 100%;
      flex-direction: column;
    }

    .panel-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .field { margin-bottom: 12px; }
    .field[hidden] { display: none !important; }

    .field input {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #f8fbff;
      color: var(--text);
      font-size: 13px;
    }

    .field input:focus {
      border-color: rgba(59, 130, 246, .75);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
      background: #ffffff;
    }

    /* Primary connect / disconnect as large icon tile */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tile-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 88px;
      padding: 12px;
      border: 1px solid transparent;
      background: linear-gradient(180deg, #3383ef, #216fdc);
      color: #fff;
      box-shadow: 0 8px 20px rgba(29, 102, 214, .2), inset 0 1px 0 rgba(255, 255, 255, .18);
    }

    .tile-btn svg { width: 26px; height: 26px; }
    .tile-btn span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .tile-btn:hover {
      background: linear-gradient(180deg, #2879e8, #1764cc);
    }

    .tile-btn.disconnect {
      border-color: rgba(240, 113, 126, .26);
      background: #fff2f4;
      color: #ce4051;
      box-shadow: none;
    }

    .tile-btn.disconnect:hover { background: #ffe8ec; }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .quick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 72px;
      padding: 8px 4px;
      border: 1px solid var(--line);
      background: #f7faff;
      color: #3f5d7a;
    }

    .quick-btn svg { width: 20px; height: 20px; }
    .quick-btn span {
      font-size: 11px;
      font-weight: 650;
      line-height: 1.2;
    }

    .quick-btn[hidden] { display: none !important; }

    .quick-btn:hover:not(:disabled) {
      border-color: var(--line-strong);
      background: var(--surface-soft);
      color: var(--text);
    }

    .quick-btn.active {
      border-color: #2f9e6b;
      background: #e8f8f0;
      color: #1f7a52;
    }

    .panel-divider {
      height: 1px;
      margin: 4px 0 14px;
      background: var(--line);
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .status-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 8px;
      border: 1px solid #e4eef7;
      border-radius: 12px;
      background: #f8fbff;
      text-align: center;
      transition: border-color .18s ease, background .18s ease;
    }

    .status-glyph {
      position: relative;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid #dce8f4;
      border-radius: 12px;
      background: #fff;
      color: #7a91a9;
      transition: color .18s ease, border-color .18s ease, background .18s ease;
    }

    .status-glyph svg { width: 18px; height: 18px; }

    .status-mark {
      position: absolute;
      right: -3px;
      bottom: -3px;
      width: 14px;
      height: 14px;
      border: 2px solid #f8fbff;
      border-radius: 50%;
      background: #9bacc0;
    }

    .status-tile b {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .status-tile[data-tone="online"] {
      border-color: #c5eadb;
      background: #f1faf6;
    }
    .status-tile[data-tone="online"] .status-glyph {
      border-color: #bce6d6;
      background: #ecf9f4;
      color: var(--success);
    }
    .status-tile[data-tone="online"] .status-mark { background: var(--success); }

    .status-tile[data-tone="working"] {
      border-color: #f1d9af;
      background: #fffaf0;
    }
    .status-tile[data-tone="working"] .status-glyph {
      border-color: #f1d9af;
      background: #fff8e9;
      color: var(--warning);
    }
    .status-tile[data-tone="working"] .status-mark {
      background: var(--warning);
      animation: pulse 1.2s infinite;
    }

    .status-tile[data-tone="error"] {
      border-color: #f2c4ca;
      background: #fff5f6;
    }
    .status-tile[data-tone="error"] .status-glyph {
      border-color: #f2c4ca;
      background: #fff0f2;
      color: var(--danger);
    }
    .status-tile[data-tone="error"] .status-mark { background: var(--danger); }

    .log-card { grid-column: 1 / -1; }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 0 12px 0 16px;
      border-bottom: 1px solid var(--line);
      background: #f7faff;
    }

    .log-header h2 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 14px;
    }

    .log-header h2 svg {
      width: 16px;
      height: 16px;
      color: var(--muted);
    }

    .log-actions { display: flex; gap: 6px; }

    #log {
      height: 160px;
      overflow: auto;
      padding: 10px 14px 12px;
      background: #f9fbfe;
      font: 12px/1.75 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .log-line {
      display: grid;
      grid-template-columns: 72px 58px minmax(0, 1fr);
      gap: 8px;
      padding: 2px 0;
      color: #3d5874;
    }

    .log-time { color: #8a9eb3; }
    .log-level { color: #397bc5; font-weight: 700; }
    .log-line.warn .log-level { color: var(--warning); }
    .log-line.error .log-level { color: var(--danger); }
    .log-line.success .log-level { color: var(--success); }
    .log-message { overflow-wrap: anywhere; }

    * {
      scrollbar-width: thin;
      scrollbar-color: #b6c7d9 transparent;
    }

    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: #b6c7d9;
      background-clip: padding-box;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .log-card { grid-column: 1; }
      .connection-panel { height: auto; }
    }

    @media (max-width: 620px) {
      .app { padding-top: 12px; }
      .topbar { margin-bottom: 12px; }
      .connection-state span:not(.state-dot) { max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
      .layout { gap: 12px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .quick-grid { grid-template-columns: repeat(3, 1fr); }
      .log-line { grid-template-columns: 64px 50px minmax(0, 1fr); gap: 5px; }
      #log { height: 140px; font-size: 11px; }
      .icon-btn[data-tip]::after { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M4 9.5 12 4l8 5.5v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />
            <circle cx="12" cy="13" r="3" />
          </svg>
        </div>
        <h1>ipc_mini</h1>
      </div>
      <div id="globalState" class="connection-state" data-tone="idle" title="连接状态">
        <span class="state-dot"></span>
        <span id="globalStateText">未连接</span>
      </div>
    </header>

    <section class="layout">
      <article class="card viewer-card">
        <div class="viewer-toolbar">
          <div class="viewer-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3.5" y="6" width="13.5" height="12" rx="2.5" />
              <path d="m17 10 3.5-2v8L17 14z" />
            </svg>
            <span id="liveBadge" class="live-badge">LIVE</span>
            <div class="mode-switch" role="tablist" aria-label="观看模式">
              <button id="modeLive" class="mode-btn active" type="button" role="tab" aria-selected="true">实时</button>
              <button id="modeReplay" class="mode-btn" type="button" role="tab" aria-selected="false">回放</button>
            </div>
          </div>
          <div class="toolbar-actions">
            <button id="talk" class="icon-btn" type="button" disabled data-tip="对讲" aria-label="对讲" title="对讲">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M12 3a3.5 3.5 0 0 0-3.5 3.5v5a3.5 3.5 0 1 0 7 0v-5A3.5 3.5 0 0 0 12 3Z" />
                <path d="M6.5 12.5a5.5 5.5 0 0 0 11 0M12 18v3" />
              </svg>
            </button>
            <button id="fullscreen" class="icon-btn" type="button" data-tip="全屏" aria-label="全屏" title="全屏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" />
              </svg>
            </button>
          </div>
        </div>

        <div id="replayBar" class="replay-bar hidden">
          <label for="replayDay">日期</label>
          <select id="replayDay"></select>
          <span id="replayStatus" class="replay-status">选择日期后播放</span>
        </div>

        <div id="stage" class="stage">
          <video id="v" autoplay playsinline muted></video>
          <canvas id="c"></canvas>
          <div id="emptyState" class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h7A2.5 2.5 0 0 1 16 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 4 16.5z" />
              <path d="m16 10 4-2v8l-4-2z" />
            </svg>
            <strong id="emptyTitle">等待连接</strong>
          </div>
        </div>

        <div class="metrics">
          <div class="metric" title="视频状态">
            <i class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3.5" y="6" width="13.5" height="12" rx="2.5" />
                <path d="m17 10 3.5-2v8L17 14z" />
              </svg>
            </i>
            <span id="metricVideo" class="metric-value">未接收</span>
          </div>
          <div class="metric" title="画面尺寸">
            <i class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M8 19v2M16 19v2M3 10h18" />
              </svg>
            </i>
            <span id="metricSize" class="metric-value">—</span>
          </div>
          <div class="metric" title="检测目标">
            <i class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 3v3M12 18v3M3 12h3M18 12h3" />
              </svg>
            </i>
            <span id="metricObjects" class="metric-value">0</span>
          </div>
          <div class="metric" title="数据通道">
            <i class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M7 8h10M7 12h7M7 16h10" />
                <rect x="4" y="4" width="16" height="16" rx="3" />
              </svg>
            </i>
            <span id="metricData" class="metric-value">未连接</span>
          </div>
        </div>
      </article>

      <aside class="sidebar">
        <section class="card panel connection-panel">
          <p class="panel-label">控制</p>
          <div class="action-grid">
            <button id="go" class="tile-btn" type="button" aria-label="开始观看">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5" />
                <path d="m10 8.8 6 3.2-6 3.2z" fill="currentColor" stroke="none" />
              </svg>
              <span id="goLabel">观看</span>
            </button>
          </div>

          <div class="quick-grid">
            <button id="talkSide" class="quick-btn" type="button" disabled aria-label="对讲">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M12 3a3.5 3.5 0 0 0-3.5 3.5v5a3.5 3.5 0 1 0 7 0v-5A3.5 3.5 0 0 0 12 3Z" />
                <path d="M6.5 12.5a5.5 5.5 0 0 0 11 0M12 18v3" />
              </svg>
              <span>对讲</span>
            </button>
            <button id="fullscreenSide" class="quick-btn" type="button" aria-label="全屏">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" />
              </svg>
              <span>全屏</span>
            </button>
            <button id="muteSide" class="quick-btn" type="button" aria-label="静音" title="静音远端声音">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M4 10v4h3.2L12 18V6L7.2 10H4Z" />
                <path d="m16 10 4 4M20 10l-4 4" />
              </svg>
              <span>静音</span>
            </button>
          </div>

          <div class="field" hidden>
            <input id="room" value="door-1" autocomplete="off" spellcheck="false" />
          </div>
          <div class="field" hidden>
            <input id="wsUrl" value="ws://114.55.94.148:8089/ws" inputmode="url" autocomplete="url" spellcheck="false" />
          </div>

          <div class="panel-divider"></div>
          <p class="panel-label">状态</p>
          <div class="status-grid">
            <div id="wsRow" class="status-tile" data-tone="idle" title="信令未连接">
              <i class="status-glyph" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M5 16.5a10 10 0 0 1 14 0M8 13a6 6 0 0 1 8 0M11 9.8a2 2 0 0 1 2 0" />
                  <circle cx="12" cy="19" r="1" fill="currentColor" stroke="none" />
                </svg>
                <i id="wsDot" class="status-mark"></i>
              </i>
              <b>信令</b>
              <span id="wsState" class="visually-hidden">未连接</span>
            </div>
            <div id="deviceRow" class="status-tile" data-tone="working" title="设备等待连接">
              <i class="status-glyph" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="4" y="6" width="13" height="12" rx="2.5" />
                  <path d="m17 10 3-2v8l-3-2z" />
                  <circle cx="10.5" cy="12" r="2.5" />
                </svg>
                <i id="deviceDot" class="status-mark"></i>
              </i>
              <b>设备</b>
              <span id="deviceState" class="visually-hidden">等待连接</span>
            </div>
            <div id="iceRow" class="status-tile" data-tone="idle" title="ICE 未建立">
              <i class="status-glyph" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="12" r="8.5" />
                  <path d="M3.8 12h16.4M12 3.5c2.2 2.3 3.2 5.1 3.2 8.5s-1 6.2-3.2 8.5C9.8 18.2 8.8 15.4 8.8 12S9.8 5.8 12 3.5Z" />
                </svg>
                <i id="iceDot" class="status-mark"></i>
              </i>
              <b>网络</b>
              <span id="iceState" class="visually-hidden">未建立</span>
            </div>
            <div id="aiRow" class="status-tile" data-tone="idle" title="AI 未连接">
              <i class="status-glyph" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="5" y="5" width="14" height="14" rx="3" />
                  <path d="M9 9v6M9 12h3M15 9v6M3 9h2M3 15h2M19 9h2M19 15h2M9 3v2M15 3v2M9 19v2M15 19v2" />
                </svg>
                <i id="aiDot" class="status-mark"></i>
              </i>
              <b>AI</b>
              <span id="aiState" class="visually-hidden">未连接</span>
            </div>
          </div>
        </section>
      </aside>

      <section class="card log-card">
        <div class="log-header">
          <h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M7 7h10M7 12h7M7 17h10" />
              <rect x="4" y="4" width="16" height="16" rx="3" />
            </svg>
            日志
          </h2>
          <div class="log-actions">
            <button id="copyLog" class="icon-btn" type="button" data-tip="复制" aria-label="复制日志" title="复制">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="8" y="8" width="11" height="11" rx="2" />
                <path d="M5 14V6a2 2 0 0 1 2-2h8" />
              </svg>
            </button>
            <button id="clearLog" class="icon-btn" type="button" data-tip="清空" aria-label="清空日志" title="清空">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12" />
              </svg>
            </button>
          </div>
        </div>
        <div id="log" role="log" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script src="/viewer.js"></script>
</body>
