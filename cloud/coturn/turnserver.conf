# coturn for zero-mini (Alibaba Cloud ECS / SWAS)
#
# Aliyun has PUBLIC + PRIVATE IP. Use:
#   external-ip=<公网IP>/<网卡私网IP>
# Example:
#   external-ip=114.55.94.148/172.26.xx.xx
#
# Find private IP on the ECS:
#   hostname -I | awk '{print $1}'
#   ip -4 route get 1.1.1.1 | awk '{print $7; exit}'
#
# MUST run with docker network_mode: host (see docker-compose.yml).
# If logs show relay addr 172.17/172.18/172.19 → host network is NOT active.

listening-port=3478
fingerprint
lt-cred-mech
# Keep in sync with board net_service.json + viewer.html
user=zeromini:cqw881013
realm=zero-mini.local

# REPLACE the private part with this machine's real NIC IP
external-ip=114.55.94.148/REPLACE_WITH_PRIVATE_IP
listening-ip=0.0.0.0
relay-ip=0.0.0.0

min-port=49152
max-port=49200
no-multicast-peers
no-cli
no-tls
no-dtls
verbose

# Do NOT enable a blanket denied-peer-ip=0.0.0.0-255.255.255.255
# unless you also list allowed-peer-ip ranges — that causes 403 Forbidden IP.
